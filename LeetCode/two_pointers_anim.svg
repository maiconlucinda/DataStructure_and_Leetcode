<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<style>
  .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }
  svg:hover .a { animation-play-state: paused; }

  #badge { opacity: 0; }
  svg:hover #badge { opacity: 1; }
  svg:hover #hint { opacity: 0; }

  .mptr    { animation-name: mptr; }
  .nptr    { animation-name: nptr; }
  .lastptr { animation-name: lastptr; }
  .mfade   { animation-name: mfade; }
  .nfade   { animation-name: nfade; }
  .rev20   { animation-name: rev20; }
  .rev40   { animation-name: rev40; }
  .rev60   { animation-name: rev60; }
  .rev80   { animation-name: rev80; }
  .p1      { animation-name: p1; }
  .p2      { animation-name: p2; }
  .p3      { animation-name: p3; }
  .p4      { animation-name: p4; }
  .p5      { animation-name: p5; }
  .hlhide  { animation-name: hlhide; }
  .hlmove  { animation-name: hlmove; }
  .hlfill  { animation-name: hlfill; }
  .bar     { animation-name: bar; transform-box: fill-box; transform-origin: left center; }

  @keyframes mptr    { 0%,55%  { transform: translate(0,0); }
                       60%,100%{ transform: translate(-48px,0); } }
  @keyframes nptr    { 0%,15%  { transform: translate(0,0); }
                       20%,35% { transform: translate(-48px,0); }
                       40%,100%{ transform: translate(-96px,0); } }
  @keyframes lastptr { 0%,15%  { transform: translate(0,0); }
                       20%,35% { transform: translate(-48px,0); }
                       40%,55% { transform: translate(-96px,0); }
                       60%,75% { transform: translate(-144px,0); }
                       80%,100%{ transform: translate(-192px,0); } }

  @keyframes mfade { 0%,79% { opacity: 1; }  81%,100% { opacity: 0.3; } }
  @keyframes nfade { 0%,79% { opacity: 1; }  81%,100% { opacity: 0; } }

  @keyframes rev20 { 0%,18% { opacity: 0; } 21%,100% { opacity: 1; } }
  @keyframes rev40 { 0%,38% { opacity: 0; } 41%,100% { opacity: 1; } }
  @keyframes rev60 { 0%,58% { opacity: 0; } 61%,100% { opacity: 1; } }
  @keyframes rev80 { 0%,78% { opacity: 0; } 81%,100% { opacity: 1; } }

  @keyframes p1 { 0%,19% { opacity: 1; } 20%,100% { opacity: 0; } }
  @keyframes p2 { 0%,19% { opacity: 0; } 20%,39%  { opacity: 1; } 40%,100% { opacity: 0; } }
  @keyframes p3 { 0%,39% { opacity: 0; } 40%,59%  { opacity: 1; } 60%,100% { opacity: 0; } }
  @keyframes p4 { 0%,59% { opacity: 0; } 60%,79%  { opacity: 1; } 80%,100% { opacity: 0; } }
  @keyframes p5 { 0%,79% { opacity: 0; } 80%,100% { opacity: 1; } }

  @keyframes hlhide { 0%,79% { opacity: 1; } 81%,100% { opacity: 0; } }
  @keyframes hlmove { 0%,35%  { transform: translate(0,0); }
                      40%,55% { transform: translate(0,-60px); }
                      60%,100%{ transform: translate(0,0); } }
  @keyframes hlfill { 0%,35%  { fill: #ffedd5; }
                      40%,55% { fill: #dbeafe; }
                      60%,100%{ fill: #ffedd5; } }
  @keyframes bar { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
</style>

<rect width="780" height="430" fill="#ffffff"/>
<text x="14" y="24" font-size="14" font-weight="bold" fill="#111827">Merge Sorted Array &#8212; dois ponteiros em movimento</text>
<text id="hint" x="14" y="42" font-size="10" fill="#64748b">passe o mouse em cima para PAUSAR &#183; tire o mouse para continuar de onde parou</text>
<g id="badge">
  <rect x="12" y="31" width="112" height="15" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="18" y="42" font-size="10" font-weight="bold" fill="#b45309">&#9208; PAUSADO</text>
  <text x="134" y="42" font-size="10" fill="#64748b">tire o mouse para continuar</text>
</g>

<!-- ===================== nums1 ===================== -->
<text x="14" y="126" font-size="11" font-weight="bold" fill="#111827">nums1</text>
<rect x="70" y="98" width="48" height="44" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="74" y="110" font-size="8" fill="#94a3b8">0</text><text x="94" y="128" font-size="16" fill="#111827" text-anchor="middle">1</text>
<rect x="118" y="98" width="48" height="44" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="122" y="110" font-size="8" fill="#94a3b8">1</text><text x="142" y="128" font-size="16" fill="#111827" text-anchor="middle">2</text>
<rect x="166" y="98" width="48" height="44" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="170" y="110" font-size="8" fill="#94a3b8">2</text><text x="190" y="128" font-size="16" fill="#111827" text-anchor="middle">3</text>
<rect x="214" y="98" width="48" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="218" y="110" font-size="8" fill="#cbd5e1">3</text><text x="238" y="128" font-size="16" fill="#cbd5e1" text-anchor="middle">0</text>
<rect x="262" y="98" width="48" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="266" y="110" font-size="8" fill="#cbd5e1">4</text><text x="286" y="128" font-size="16" fill="#cbd5e1" text-anchor="middle">0</text>
<rect x="310" y="98" width="48" height="44" rx="3" fill="#ffffff" stroke="#cbd5e1"/><text x="314" y="110" font-size="8" fill="#cbd5e1">5</text><text x="334" y="128" font-size="16" fill="#cbd5e1" text-anchor="middle">0</text>

<g class="a rev20" opacity="0">
  <rect x="310" y="98" width="48" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="314" y="110" font-size="8" fill="#16a34a">5</text><text x="334" y="128" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">6</text>
</g>
<g class="a rev40" opacity="0">
  <rect x="262" y="98" width="48" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="266" y="110" font-size="8" fill="#16a34a">4</text><text x="286" y="128" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">5</text>
</g>
<g class="a rev60" opacity="0">
  <rect x="214" y="98" width="48" height="44" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="218" y="110" font-size="8" fill="#2563eb">3</text><text x="238" y="128" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">3</text>
</g>
<g class="a rev80" opacity="0">
  <rect x="166" y="98" width="48" height="44" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="170" y="110" font-size="8" fill="#16a34a">2</text><text x="190" y="128" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">2</text>
</g>

<g class="a mfade">
  <g class="a mptr">
    <text x="190" y="78" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">m-1</text>
    <text x="190" y="93" font-size="12" fill="#2563eb" text-anchor="middle">&#9660;</text>
  </g>
</g>
<g class="a lastptr">
  <text x="334" y="158" font-size="12" fill="#16a34a" text-anchor="middle">&#9650;</text>
  <text x="334" y="172" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">last</text>
</g>

<!-- ===================== nums2 ===================== -->
<text x="14" y="240" font-size="11" font-weight="bold" fill="#c2410c">nums2</text>
<rect x="70" y="212" width="48" height="44" rx="3" fill="#fff7ed" stroke="#fb923c"/><text x="74" y="224" font-size="8" fill="#fdba74">0</text><text x="94" y="242" font-size="16" fill="#c2410c" text-anchor="middle">2</text>
<rect x="118" y="212" width="48" height="44" rx="3" fill="#fff7ed" stroke="#fb923c"/><text x="122" y="224" font-size="8" fill="#fdba74">1</text><text x="142" y="242" font-size="16" fill="#c2410c" text-anchor="middle">5</text>
<rect x="166" y="212" width="48" height="44" rx="3" fill="#fff7ed" stroke="#fb923c"/><text x="170" y="224" font-size="8" fill="#fdba74">2</text><text x="190" y="242" font-size="16" fill="#c2410c" text-anchor="middle">6</text>

<g class="a rev20" opacity="0">
  <rect x="166" y="212" width="48" height="44" rx="3" fill="#ffffff" stroke="#e5e7eb"/><text x="190" y="242" font-size="16" fill="#d1d5db" text-anchor="middle">6</text>
  <line x1="172" y1="252" x2="208" y2="216" stroke="#e5e7eb" stroke-width="2"/>
</g>
<g class="a rev40" opacity="0">
  <rect x="118" y="212" width="48" height="44" rx="3" fill="#ffffff" stroke="#e5e7eb"/><text x="142" y="242" font-size="16" fill="#d1d5db" text-anchor="middle">5</text>
  <line x1="124" y1="252" x2="160" y2="216" stroke="#e5e7eb" stroke-width="2"/>
</g>
<g class="a rev80" opacity="0">
  <rect x="70" y="212" width="48" height="44" rx="3" fill="#ffffff" stroke="#e5e7eb"/><text x="94" y="242" font-size="16" fill="#d1d5db" text-anchor="middle">2</text>
  <line x1="76" y1="252" x2="112" y2="216" stroke="#e5e7eb" stroke-width="2"/>
</g>

<g class="a nfade">
  <g class="a nptr">
    <text x="190" y="192" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">n-1</text>
    <text x="190" y="207" font-size="12" fill="#ea580c" text-anchor="middle">&#9660;</text>
  </g>
</g>

<!-- ===================== codigo ===================== -->
<rect x="420" y="62" width="330" height="196" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
<g class="a hlhide">
  <g class="a hlmove">
    <rect class="a hlfill" x="426" y="178" width="318" height="38" rx="3" fill="#ffedd5"/>
  </g>
</g>
<g class="a rev80" opacity="0">
  <rect x="426" y="78" width="318" height="20" rx="3" fill="#fee2e2"/>
</g>
<rect x="426" y="218" width="318" height="20" rx="3" fill="#dcfce7" opacity="0.7"/>
<text x="432" y="92"  font-size="12" fill="#111827">while m &gt; 0 and n &gt; 0:</text>
<text x="432" y="112" font-size="12" fill="#111827">    if nums1[m-1] &gt; nums2[n-1]:</text>
<text x="432" y="132" font-size="12" fill="#1d4ed8">        nums1[last] = nums1[m-1]</text>
<text x="432" y="152" font-size="12" fill="#1d4ed8">        m -= 1</text>
<text x="432" y="172" font-size="12" fill="#111827">    else:</text>
<text x="432" y="192" font-size="12" fill="#c2410c">        nums1[last] = nums2[n-1]</text>
<text x="432" y="212" font-size="12" fill="#c2410c">        n -= 1</text>
<text x="432" y="232" font-size="12" fill="#15803d">    last -= 1</text>

<!-- ===================== barra de progresso ===================== -->
<rect x="20" y="276" width="730" height="4" rx="2" fill="#e5e7eb"/>
<rect class="a bar" x="20" y="276" width="730" height="4" rx="2" fill="#2563eb"/>

<!-- ===================== painel de decisao ===================== -->
<g class="a p1">
  <text x="20" y="302" font-size="12" font-weight="bold" fill="#111827">Volta 1  &#183;  m=3  n=3  last=5</text>
  <text x="20" y="322" font-size="12" fill="#111827">nums1[2]=3  &gt;  nums2[2]=6 ?   N&#195;O  &#8594;  vai pro else</text>
  <text x="20" y="342" font-size="12" fill="#ea580c">grava 6 em nums1[5]  &#183;  n--  &#183;  last--      <tspan fill="#2563eb">m fica parado</tspan></text>
</g>
<g class="a p2" opacity="0">
  <text x="20" y="302" font-size="12" font-weight="bold" fill="#111827">Volta 2  &#183;  m=3  n=2  last=4</text>
  <text x="20" y="322" font-size="12" fill="#111827">nums1[2]=3  &gt;  nums2[1]=5 ?   N&#195;O  &#8594;  vai pro else</text>
  <text x="20" y="342" font-size="12" fill="#ea580c">grava 5 em nums1[4]  &#183;  n--  &#183;  last--      <tspan fill="#2563eb">m parado de novo</tspan></text>
</g>
<g class="a p3" opacity="0">
  <text x="20" y="302" font-size="12" font-weight="bold" fill="#111827">Volta 3  &#183;  m=3  n=1  last=3</text>
  <text x="20" y="322" font-size="12" fill="#111827">nums1[2]=3  &gt;  nums2[0]=2 ?   SIM  &#8594;  vai pro if</text>
  <text x="20" y="342" font-size="12" fill="#2563eb">grava 3 em nums1[3]  &#183;  m--  &#183;  last--      <tspan fill="#ea580c">agora o n fica parado</tspan></text>
</g>
<g class="a p4" opacity="0">
  <text x="20" y="302" font-size="12" font-weight="bold" fill="#111827">Volta 4  &#183;  m=2  n=1  last=2</text>
  <text x="20" y="322" font-size="12" fill="#111827">nums1[1]=2  &gt;  nums2[0]=2 ?   N&#195;O  &#8594;  vai pro else</text>
  <text x="20" y="342" font-size="12" fill="#ea580c">grava 2 em nums1[2]  &#183;  n--  &#183;  last--      <tspan fill="#2563eb">m parado</tspan></text>
</g>
<g class="a p5" opacity="0">
  <text x="20" y="302" font-size="12" font-weight="bold" fill="#111827">Fim  &#183;  m=2  n=0  last=1</text>
  <text x="20" y="322" font-size="12" fill="#dc2626">n == 0  &#8594;  a condi&#231;&#227;o do while falhou, o loop morre aqui</text>
  <text x="20" y="342" font-size="12" font-weight="bold" fill="#15803d">[1, 2, 2, 3, 5, 6]   &#8212;   nums1[0] e nums1[1] nunca foram tocados</text>
</g>

<line x1="20" y1="364" x2="750" y2="364" stroke="#e5e7eb"/>
<text x="20"  y="384" font-size="10" fill="#2563eb">m-1 andou 1x / 4 voltas</text>
<text x="190" y="384" font-size="10" fill="#ea580c">n-1 andou 3x / 4 voltas</text>
<text x="360" y="384" font-size="10" fill="#16a34a">last andou 4x / 4 voltas</text>
<text x="20" y="404" font-size="10" fill="#475569">s&#243; o <tspan fill="#16a34a">last</tspan> tem ritmo de for. <tspan fill="#2563eb">m</tspan> e <tspan fill="#ea580c">n</tspan> andam quando o if manda &#8212; e o if depende dos dados, que voc&#234; n&#227;o conhece antes de rodar.</text>
<text x="20" y="420" font-size="10" fill="#475569">Por isso while: ele n&#227;o imp&#245;e ritmo nenhum, s&#243; pergunta &quot;ainda vale a pena continuar?&quot;</text>
</svg>
